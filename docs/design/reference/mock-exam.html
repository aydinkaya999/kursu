<!doctype html>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5FC; color: #151B2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 14px 20px 10px; display: flex; flex-direction: column">

</div>

<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border: 1.5px solid #C9D2E6; border-radius: 999px; background: #FFFFFF; color: #151B2E; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700">

Sonra bak
