<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5FC; color: #151B2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 16px 20px 20px; display: flex; flex-direction: column">

<span style="font-size: 15px; font-weight: 800">Seviye tespiti</span>

</div>

<p style="margin: 12px 0 0; font-size: 17px; line-height: 26px; font-weight: 600; text-wrap: pretty">Bir öğrenci tek başına çözemediği bir problemi, öğretmeninin verdiği ipuçlarıyla çözebilmektedir. Bu durum Vygotsky'nin hangi kavramıyla açıklanır?</p>

<button type="button" aria-pressed="false" style="min-height: 54px; box-sizing: border-box; border: 1.5px solid #C9D2E6; border-radius: 16px; background: #FFFFFF; color: #151B2E; font-family: inherit; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left">

<span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 999px; background: #2957E8; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">B</span>

<span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 999px; background: #EDF1FA; color: #151B2E; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">C</span>

<button type="button" aria-pressed="false" style="min-height: 54px; box-sizing: border-box; border: 1.5px solid #C9D2E6; border-radius: 16px; background: #FFFFFF; color: #151B2E; font-family: inherit; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 999px; background: #EDF1FA; color: #151B2E; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">D</span>

<button type="button" aria-pressed="false" style="min-height: 54px; box-sizing: border-box; border: 1.5px solid #C9D2E6; border-radius: 16px; background: #FFFFFF; color: #151B2E; font-family: inherit; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 999px; background: #EDF1FA; color: #151B2E; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">E</span>

Emin değilim

<a href="placement-result.html" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; justify-content: center; background: #2957E8; color: #FFFFFF; border-radius: 999px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 24px rgba(41, 87, 232, 0.25)">Sonraki soru</a>
