<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kürsü reference: Karşılama</title>
<!-- Static design reference exported from the Kürsü design canvas. Not app code. View at 390 px width. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D9DEEA;display:flex;justify-content:center}
a{color:#2957E8}a:hover{color:#1E3FA8}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5FC; color: #151B2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 24px 20px 16px; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 24px; line-height: 30px; font-weight: 800; color: #2957E8; letter-spacing: -0.02em">Kürsü</span>
<span style="font-size: 12px; font-weight: 800; color: #7A5200; background: #FFF1CC; border-radius: 999px; padding: 7px 12px; white-space: nowrap">AGS · 8 Mayıs 2027</span>
</header>
<h1 style="margin: 22px 0 0; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance">Planını üç soruda kuralım</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 22px; color: #55607A">Yanıtların günlük programını ve konu sırasını belirler.</p>
<form style="margin: 20px 0 0; background: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 8px 24px rgba(21, 27, 46, 0.06)">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="brans" style="font-size: 14px; line-height: 20px; font-weight: 800">Branşın</label>
<select id="brans" style="min-height: 52px; box-sizing: border-box; border: 1.5px solid #8A94AD; border-radius: 14px; background: #FFFFFF; color: #151B2E; padding: 0 14px; font-family: inherit; font-size: 15px; font-weight: 600">
<option>Sınıf Öğretmenliği</option>
<option>Okul Öncesi Öğretmenliği</option>
<option>Türkçe Öğretmenliği</option>
<option>İngilizce Öğretmenliği</option>
</select>
<span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #0C5F6B; background: #DDF3F5; border-radius: 12px; padding: 8px 12px">Puan türün P2: AGS %50, ÖABT %50.</span>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin: 0 0 10px; font-size: 14px; line-height: 20px; font-weight: 800">Günde ne kadar çalışabilirsin?</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="false" style="min-height: 48px; border: 0; border-radius: 999px; background: #EDF1FA; color: #151B2E; font-family: inherit; font-size: 15px; font-weight: 700">30 dk</button>
<button type="button" aria-pressed="true" style="min-height: 48px; border: 0; border-radius: 999px; background: #2957E8; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800">60 dk</button>
<button type="button" aria-pressed="false" style="min-height: 48px; border: 0; border-radius: 999px; background: #EDF1FA; color: #151B2E; font-family: inherit; font-size: 15px; font-weight: 700">90 dk</button>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin: 0 0 10px; font-size: 14px; line-height: 20px; font-weight: 800">Sınava kaçıncı kez giriyorsun?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 48px; border: 0; border-radius: 999px; background: #2957E8; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800">İlk kez</button>
<button type="button" aria-pressed="false" style="min-height: 48px; border: 0; border-radius: 999px; background: #EDF1FA; color: #151B2E; font-family: inherit; font-size: 15px; font-weight: 700">Yeniden</button>
</div>
</fieldset>
</form>
<div style="margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 8px">
<a href="placement-test.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; background: #2957E8; color: #FFFFFF; border-radius: 999px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 24px rgba(41, 87, 232, 0.25)">Seviye testine başla</a>
<span style="font-size: 13px; line-height: 18px; color: #55607A; text-align: center">30 soru · yaklaşık 25 dakika · kayıt gerekmez</span>
<a href="today.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">Önce uygulamayı gez</a>
</div>
</div>
</body>
</html>
