services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kursu}
      POSTGRES_USER: ${POSTGRES_USER:-kursu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kursu_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
